syntax = "proto3";

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "ClientToManagerStubs";
option java_outer_classname = "ClientToManagerProto";



package clientToManager;

service ClientToManagerService {
  rpc GetServer (google.protobuf.Empty) returns (ImageInfo);
}


message ImgRegist {
  string ip = 1;
  int32 port = 2;

}

message ImageInfo {
  string uid = 1;
  ImgRegist serverInfo = 2;

}

